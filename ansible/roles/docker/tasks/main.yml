- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/dockerd --validate --config-file %s

- name: Run Docker at boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Return a host an earlier run drained to service
  ansible.builtin.include_tasks: reactivate.yml

- name: Check whether Docker runs the current daemon.json
  ansible.builtin.include_role:
    name: config_marker
    tasks_from: check
  vars:
    config_marker_name: docker-daemon
    config_marker_files: [/etc/docker/daemon.json]

- name: Restart Docker with the host drained
  ansible.builtin.include_tasks: restart-drained.yml
  when: config_marker_check.rc == 1
