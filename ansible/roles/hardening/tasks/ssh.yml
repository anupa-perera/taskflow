# sshd keeps the first value it reads for each setting, and the main config includes
# sshd_config.d/*.conf in name order, so a 10- file wins over the AMI's 50-redhat.conf.
- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-taskflow-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s

- name: Check whether sshd runs the current hardening
  ansible.builtin.include_role:
    name: config_marker
    tasks_from: check
  vars:
    config_marker_name: sshd
    config_marker_files: [/etc/ssh/sshd_config.d/10-taskflow-hardening.conf]

- name: Reload sshd with the current hardening
  when: config_marker_check.rc == 1
  block:
    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: sshd
        state: reloaded

    - name: Record the hardening sshd now runs
      ansible.builtin.include_role:
        name: config_marker
        tasks_from: record
      vars:
        config_marker_name: sshd
        config_marker_files: [/etc/ssh/sshd_config.d/10-taskflow-hardening.conf]
