# Accepted security exceptions. Each one is scoped to specific paths, explains why it is accepted,
# and expires so it must be re-decided rather than forgotten. Paths are relative to the repo root.
misconfigurations:
  - id: AWS-0132
    paths:
      - terraform/bootstrap/main.tf
    statement: >-
      Terraform state bucket uses SSE-S3 rather than a customer-managed KMS key. The bucket is
      private, denies non-TLS requests and is readable only by the deploying identities, so a
      separate kms:Decrypt permission adds little for a single-operator project. Revisit if more
      principals gain read access to the bucket. See ADR 0004.
    expired_at: 2027-04-24

  - id: AWS-0104
    paths:
      - terraform/modules/ecs-cluster/main.tf
    statement: >-
      ECS hosts need outbound HTTPS to public AWS endpoints (ECS, ECR, SSM, CloudWatch, STS) and
      package repositories. Egress is TCP 443 only, from private subnets through the NAT gateway,
      with no inbound rules; task security groups are restricted to RDS and do not use this rule.
      Interface VPC endpoints for every service would cost about $5/day, more than the rest of the
      stack. Upgrade path: interface endpoints or an egress firewall with a domain allow-list.
    expired_at: 2027-04-24

  - id: AWS-0054
    paths:
      - terraform/modules/service/alb.tf
    statement: >-
      The ALB listens on plain HTTP because there is no domain to issue an ACM certificate for.
      The API carries no credentials or personal data. Upgrade path: an ACM certificate, an HTTPS
      listener and a redirect from port 80.
    expired_at: 2027-04-24

  - id: AWS-0053
    paths:
      - terraform/modules/service/alb.tf
    statement: >-
      The ALB is the public entry point of the API by design. Tasks and the database sit in private
      subnets behind it, reachable only through their security group references.
    expired_at: 2027-04-24
